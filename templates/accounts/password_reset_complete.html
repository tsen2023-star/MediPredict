{% extends 'base.html' %}
{% load static %}

{% block title %}Password Reset Complete | MediPredict{% endblock %}

{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-7">
        <div class="auth-card text-center">

          <div class="auth-icon mx-auto mb-3 text-success">
            <i class="bi bi-shield-check"></i>
          </div>

          <h2 class="fw-bold mb-2">Password Reset Successful</h2>
          <p class="auth-description mb-4">
            Your password has been reset successfully. You can now log in using your new credentials.
          </p>

          <a href="{% url 'login' %}" class="btn btn-primary w-100">
            Log in now
          </a>

        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
